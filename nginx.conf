user root;
worker_priority -10;
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_core 65535;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
	use epoll;
	worker_connections 65535;
}

http {
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	charset utf-8;
	server_tokens off;
	keepalive_timeout 300;
	types_hash_max_size 2048;
	autoindex off;
	autoindex_exact_size off;
	autoindex_localtime on;
	client_header_buffer_size 4k;
	client_max_body_size 32m;
	open_file_cache max=4096 inactive=300s;
	open_file_cache_valid 30s;
	open_file_cache_min_uses 1;
	gzip on;
	gzip_min_length 1k;
	gzip_buffers 4 16k;
	gzip_comp_level 1;
	gzip_disable "msie6";
	gzip_types text/plain text/xml text/css text/javascript application/json application/x-javascript application/xml;
	default_type application/octet-stream;
	proxy_ignore_headers X-Accel-Buffering;
	# proxy_set_header Range $http_range;
	# proxy_set_header If-Range $http_if_range;
	proxy_http_version 1.1;
	proxy_buffering off;
	proxy_cache off;
	proxy_read_timeout 300s;
	proxy_send_timeout 300s;
	access_log /dev/null;
	error_log /dev/stderr warn;
	root /var/www/html;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	server {
		listen 80 default_server;

		server_name _;

		# ssl_certificate /mnt/server.crt.pem;
		# ssl_certificate_key /mnt/server.key.pem;
		# ssl_protocols TLSv1.3 TLSv1.2 TLSv1.1 TLSv1;
		# ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5:!RC4;
		# ssl_prefer_server_ciphers on;
		# ssl_session_cache shared:SSL:16m;
		# ssl_buffer_size 4k;
		# ssl_stapling off;
		# ssl_stapling_verify off;
		# error_page 497 =302 https://$host$request_uri;

		autoindex off;
		gzip off;

		root /var/www/html;
		index index.html;

		location = /usage {
			absolute_redirect off;
			return 302 /usage/;
		}

		location ^~ /usage/ {
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-For $remote_addr;
			proxy_pass http://127.0.0.1:8318;
		}

		location / {
			client_max_body_size 100m;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-For $remote_addr;
			proxy_pass http://127.0.0.1:8317/;
		}
	}

	types {
		text/html				html htm shtml;
		text/css				css;
		text/plain				txt;
		text/xml				xml rss;
		text/mathml				mml;
		text/vnd.sun.j2me.app-descriptor	jad;
		text/vnd.wap.wml			wml;
		text/x-component			htc;
		image/gif				gif;
		image/jpeg				jpeg jpg;
		image/png				png;
		image/tiff				tif tiff;
		image/vnd.wap.wbmp			wbmp;
		image/x-icon				ico;
		image/x-jng				jng;
		image/x-ms-bmp				bmp;
		image/svg+xml				svg svgz;
		application/x-javascript		js;
		application/atom+xml			atom;
		application/java-archive		jar war ear;
		application/json			json;
		application/mac-binhex40		hqx;
		application/msword			doc;
		application/pdf				pdf;
		application/postscript			ps eps ai;
		application/rtf				rtf;
		application/vnd.ms-excel		xls;
		application/vnd.ms-powerpoint		ppt;
		application/vnd.wap.wmlc		wmlc;
		application/vnd.google-earth.kml+xml	kml;
		application/vnd.google-earth.kmz	kmz;
		application/x-7z-compressed		7z;
		application/x-cocoa			cco;
		application/x-java-archive-diff		jardiff;
		application/x-java-jnlp-file		jnlp;
		application/x-makeself			run;
		application/x-perl			pl pm;
		application/x-pilot			prc pdb;
		application/x-rar-compressed		rar;
		application/x-redhat-package-manager	rpm;
		application/x-sea			sea;
		application/x-shockwave-flash		swf;
		application/x-stuffit			sit;
		application/x-tcl			tcl tk;
		application/x-x509-ca-cert		der pem crt;
		application/x-xpinstall			xpi;
		application/xhtml+xml			xhtml;
		application/zip				zip;
		application/xap				xap;
		application/appx			appx;
		application/apk				apk;
		application/octet-stream		bin exe dll;
		application/octet-stream		deb;
		application/octet-stream		dmg;
		application/octet-stream		eot;
		application/octet-stream		iso img;
		application/octet-stream		msi msp msm;
		application/ogg				ogx;
		audio/midi				mid midi kar;
		audio/mpeg				mpga mpega mp2 mp3 m4a;
		audio/ogg				oga ogg spx;
		audio/x-realaudio			ra;
		audio/webm				weba;
		video/3gpp				3gpp 3gp;
		video/mp4				mp4;
		video/mpeg				mpeg mpg mpe;
		video/Matroska				mkv;
		video/ogg				ogv;
		video/quicktime				mov;
		video/webm				webm;
		video/x-flv				flv;
		video/x-mng				mng;
		video/x-ms-asf				asx asf;
		video/x-ms-wmv				wmv;
		video/x-msvideo				avi;
	}
}
